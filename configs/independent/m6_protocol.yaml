# M6 held-out comparison protocol (masterplan v2 sections 10, 11 and 16).
# Frozen before any held-out run. Its SHA-256 (LF line endings) is pinned in
# attain_sampling.eval.m6.FROZEN_PROTOCOL_SHA256 and in docs/decision_log.md (D048);
# scripts/run_m6.py refuses to run if the file differs. Changing anything here turns
# earlier results into development evidence and requires a new task set.
schema_version: 1
protocol_id: m6-heldout-v1
frozen_on: "2026-09-17"
question: >-
  In the same mission budget, does the execution-aware policy P give a measurable
  benefit in field RMSE, fixed-target attainment or compute over the periodic
  replanner B3, and how early does each forecast call a missed target?

tasks:
  # Held-out: never used in development. Development used 7, 19 and 31 (independent
  # profile), 43 and 59 (ECC profile) and 731 (M3 synthetic stream).
  seed_start: 9001
  seed_count: 40
  development_seeds: [7, 19, 31, 43, 59, 731]
  robots: 4
  duration_s: 90.0
  controller: qp
  gp_backend: exact

# Frozen M2-M4 development settings; everything else is a MappingConfig default.
settings:
  dp_horizon_steps: 4
  dp_grid_shape: [9, 7]
  dp_travel_weight: 0.01
  p_switch_margin: 0.01
  p_deviation_trigger_m: 1.5
  p_intervention_trigger_mps: 0.25
  p_max_rollout_candidates: 6
  target_mean_variance: 0.0474

target:
  value: 0.0474
  rule: >-
    median over development seeds 7, 19 and 31 of B3's mission-end mean latent
    variance, combined scenario, 4 robots, 90 s (0.047439), rounded to three
    significant figures; set before any held-out run and shared by every method
  outcome: reached when the mission-end mean latent variance is at most the target

methods:
  sweep: B0
  greedy: B1
  adaptive: B2
  dp: B3
  p: P

blocks:
  main:
    methods: [sweep, greedy, adaptive, dp, p]
    scenarios:
      nominal: {base: nominal}
      dropout: {base: dropout}
      drift: {base: drift}
      combined: {base: combined}
      short_budget: {base: combined, duration_s: 45.0}
  ablation:
    # The three mandatory ablations of section 10 on one representative block.
    # Full P and B3 come from main/combined on the same tasks.
    methods: [p]
    scenario: {name: combined, base: combined}
    variants:
      p_no_rollout: {p_controller_rollout: false}
      p_no_retain: {p_retain_plan: false}
      p_periodic_only: {p_event_triggers: false}
  sogp:
    # Same policies with the bounded SOGP. Capacity 32 is below the ~53 samples a
    # combined mission receives, so pruning is exercised (64 never fills; pilot).
    methods: [dp, p]
    scenario: {name: combined, base: combined}
    variants:
      sogp_32: {gp_backend: sogp, sogp_max_basis: 32}
  mismatch:
    # GP length scale twice the development value: a smoother model than the field.
    methods: [sweep, greedy, adaptive, dp, p]
    scenario: {name: nominal, base: nominal}
    variants:
      length_scale_16: {length_scale: 16.0}

analysis:
  primary:
    metric: rmse
    comparison: [p, dp]
    block: main
    statement: mission-end field RMSE on the fixed grid, paired P minus B3, per scenario
  secondary_metrics:
    - mean_variance
    - max_variance
    - target_reached
    - first_reach_time_s
    - path_length
    - samples_received
    - planning_s
    - runtime_s
    - min_separation
    - one_step_forecast_error
  context_pairs: [[p, adaptive], [dp, adaptive], [p, sweep], [dp, sweep]]
  bootstrap:
    resamples: 10000
    seed: 20260917
    level: 0.95
    method: percentile of the resampled mean paired difference, resampling tasks
  tie_tolerance: 1.0e-9
  failures: >-
    a failed run is kept and counted; a pair with a failed run is excluded from the
    paired differences and the exclusion is reported next to every statistic
  warnings:
    rule: a method warns at a sampling epoch when its mission-end forecast exceeds the target
    p: target_risk best candidate over the bounded set (P's own rule), and P's selected plan
    dp: >-
      the evaluator applies the same hold continuation to B3's selected plan and
      recorded belief; B3 never uses this value
    blocks: [main]
    report: >-
      per epoch recall and false-alarm rate against the method's own mission outcome,
      first warning epoch, and the earliest epoch from which the warning stays correct
  forecast_error:
    definition: realised minus forecast mean latent variance one epoch ahead
    methods: [adaptive, dp, p]
  multiplicity: >-
    no correction; the primary comparison is named in advance and every other
    difference is descriptive

execution:
  workers: 16
  timing_note: >-
    wall-clock on a shared machine; methods within one task run sequentially in one
    process, so their relative cost is comparable, absolute times are not
